<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainstorming — AI 头脑风暴</title>
  <meta name="description" content="AI 驱动的结构化头脑风暴工具，将模糊想法打磨成完整设计方案">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settings-overlay">
    <div class="modal" id="settings-modal">
      <div class="modal-header">
        <h2>大模型设置</h2>
        <button class="modal-close" id="btn-close-settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>配置环境选择</label>
          <div style="display:flex; gap: 8px; align-items: center; margin-bottom: 8px;">
            <select id="setting-profile" style="flex:1; padding: 12px 16px; border: 1px solid var(--border-medium); border-radius: var(--radius-md); background: var(--bg-app); color: var(--text-main); font-size: 0.95rem; outline: none; font-family: inherit;">
              <option value="">自定义配置</option>
            </select>
            <input type="text" id="setting-profile-name" placeholder="配置名称 (如 DeepSeek)" style="flex:1; margin-bottom: 0; padding: 12px 16px; background: var(--bg-app); border: 1px solid var(--border-medium); border-radius: var(--radius-md); color: var(--text-main); font-size: 0.95rem; outline: none;">
          </div>
          <div style="display:flex; gap: 8px;">
            <button class="btn btn-ghost" id="btn-save-profile" style="flex: 1; padding: 6px 0; font-size: 0.85rem;">保存当前配置集</button>
            <button class="btn btn-ghost" id="btn-delete-profile" style="padding: 6px 12px; color: var(--error); border-color: rgba(184, 58, 58, 0.2); display:none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align: middle;"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
        <div style="height: 1px; background: var(--border-light); margin: 20px 0;"></div>
        <div class="form-group">
          <label for="setting-api-key">API Key</label>
          <input type="password" id="setting-api-key" placeholder="sk-..." autocomplete="off">
          <p class="form-hint">支持 OpenAI 兼容格式的凭证</p>
        </div>
        <div class="form-group">
          <label for="setting-base-url">API Base URL</label>
          <input type="text" id="setting-base-url" placeholder="https://api.openai.com/v1">
          <p class="form-hint">留空则使用服务器端默认配置</p>
        </div>
        <div class="form-group">
          <label for="setting-model">推理模型</label>
          <input type="text" id="setting-model" placeholder="gpt-4o">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btn-save-settings">保存配置</button>
      </div>
    </div>
  </div>

  <!-- Export Preview Modal -->
  <div class="modal-overlay hidden" id="export-overlay">
    <div class="modal modal-lg" id="export-modal">
      <div class="modal-header">
        <h2>设计方案预览</h2>
        <button class="modal-close" id="btn-close-export">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="export-preview" id="export-preview"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-copy-export">复制结果</button>
        <button class="btn btn-primary" id="btn-download-export">下载文档 (.md)</button>
      </div>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/>
              <path d="M9 21h6"/><path d="M10 17v-2.5"/><path d="M14 17v-2.5"/>
            </svg>
          </div>
          <span class="logo-text">Brainstorming</span>
        </div>
        <div class="header-actions" style="display: flex; gap: 4px;">
          <button class="btn-icon btn-new-session" id="btn-new-session" title="开启新篇章">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="btn-icon" id="btn-collapse-sidebar" title="收起侧边栏">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
        </div>
      </div>

      <div class="sidebar-sessions" id="session-list">
        <!-- Sessions rendered by JS -->
      </div>

      <div class="sidebar-footer">
        <button class="btn-settings" id="btn-settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
          <span>大模型设置</span>
        </button>
      </div>
    </aside>

    <!-- Sidebar toggle (appears when collapsed or on mobile) -->
    <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" title="展开侧边栏">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>

    <!-- Main Content -->
    <main class="main">
      <!-- Step Tracker -->
      <div class="step-tracker" id="step-tracker">
        <div class="step active" data-step="1">
          <div class="step-dot"></div>
          <span class="step-label">探索</span>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="2">
          <div class="step-dot"></div>
          <span class="step-label">方案</span>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="3">
          <div class="step-dot"></div>
          <span class="step-label">设计</span>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="4">
          <div class="step-dot"></div>
          <span class="step-label">审核</span>
        </div>
        <div class="step-line"></div>
        <div class="step" data-step="5">
          <div class="step-dot"></div>
          <span class="step-label">完成</span>
        </div>
      </div>

      <!-- Chat Area -->
      <div class="chat-area" id="chat-area">
        <!-- Welcome screen -->
        <div class="welcome" id="welcome-screen">
          <h1 class="welcome-title">构思，即刻开始</h1>
          <p class="welcome-subtitle">将模糊的灵感交给我，我们将通过有条理的对话，将其雕琢为详尽且优雅的设计规格方案。</p>
          <div class="welcome-suggestions">
            <button class="suggestion" data-prompt="我想重构现有的任务管理工具，让它看起来更现代、轻量化。">构建现代化的任务管理工具</button>
            <button class="suggestion" data-prompt="如何为自由撰稿人设计一个极简的个人作品集网站？">构思个人作品集网站与博客</button>
            <button class="suggestion" data-prompt="我想做一个基于地理位置的独立探店打卡小程序，该如何切入？">设计轻量级探店打卡应用</button>
          </div>
        </div>

        <!-- Chat messages container -->
        <div class="chat-messages" id="chat-messages"></div>
      </div>

      <!-- Input Area -->
      <div class="input-area" id="input-area">
        <div class="input-wrapper">
          <textarea id="chat-input" placeholder="输入你想聊的灵感，或按 Enter 回车发送…" rows="1"></textarea>
          <button id="btn-send" class="btn-send" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
        <div class="input-footer">
          <button class="btn-export" id="btn-export">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>生成规格文档</span>
          </button>
          <span class="step-hint" id="step-hint">构思阶段 · 探索</span>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
